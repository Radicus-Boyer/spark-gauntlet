<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Spark Gauntlet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;color:#fff;font-family:"Press Start 2P","Courier New",monospace;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
#app{position:fixed;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column}
#stage{flex:1;display:flex;align-items:center;justify-content:center;position:relative;touch-action:none;min-height:0;overflow:hidden}
#cv{image-rendering:pixelated;image-rendering:crisp-edges;display:block;background:#000}
#topbtns{position:absolute;top:8px;right:8px;display:flex;gap:6px;z-index:5}
.tbtn{font:inherit;font-size:9px;background:rgba(0,0,0,.6);color:#aaa;border:2px solid #555;padding:8px 9px;cursor:pointer;touch-action:manipulation}
.tbtn:hover{color:#ffe14a;border-color:#ffe14a}
.plat-phone #btnFull{display:none}
#touch{display:none;flex:none;height:170px;padding:10px 14px;padding-bottom:calc(10px + env(safe-area-inset-bottom));gap:12px;touch-action:none;background:#060606;border-top:3px solid #222;align-items:center;justify-content:space-between}
body.fighting.plat-phone #touch,.plat-phone body.fighting #touch{display:flex}
.tcol{display:flex;flex-direction:column;gap:10px;flex:1;max-width:48%}
.tb{font:inherit;background:#000;color:#fff;border:3px solid #fff;touch-action:none;-webkit-user-select:none;user-select:none;border-radius:10px}
.tb.small{height:62px;font-size:11px}
#tSpell{color:#c07aff;border-color:#c07aff}
#tSpecial{color:#777;border-color:#444}
#tSpecial.ready{color:#ffe14a;border-color:#ffe14a;animation:pulse .6s infinite alternate}
#tFire{width:132px;height:132px;border-radius:50%;font-size:13px;color:#4ad8ff;border-color:#4ad8ff}
#tFire.guard{color:#6aff8a;border-color:#6aff8a}
#tFire.down{background:#221400}
@keyframes pulse{from{transform:scale(1)}to{transform:scale(1.04)}}
#ui{position:fixed;top:0;left:0;right:0;bottom:0;overflow-y:auto;-webkit-overflow-scrolling:touch;background:rgba(0,0,0,.8);display:none;padding:22px 16px 44px;touch-action:pan-y;z-index:10}
#ui.show{display:block}
.panel{max-width:780px;margin:0 auto;text-align:center}
h1.logo{font-size:38px;line-height:1.3;color:#fff;text-shadow:4px 4px 0 #1a7cff;margin:14px 0 6px;cursor:pointer;letter-spacing:2px}
h2{font-size:18px;margin:8px 0 14px;color:#ffe14a;line-height:1.5}
h3{font-size:11px;margin:18px 0 8px;color:#ff9a3a;line-height:1.6}
p,li{font-size:10px;line-height:1.9}
.sub{color:#aaa;margin-bottom:14px}
.muted{color:#888}
.y{color:#ffe14a}.r{color:#ff4a5a}.g{color:#6aff8a}.b{color:#6ad8ff}.p{color:#c07aff}.o{color:#ff9a3a}
.btn{font:inherit;font-size:11px;background:#000;color:#4ad8ff;border:3px solid #4ad8ff;padding:11px 14px;margin:5px;cursor:pointer;min-height:44px;touch-action:manipulation;line-height:1.4}
.btn:hover,.btn:focus-visible{color:#ffe14a;border-color:#ffe14a;outline:none}
.btn:hover:not([disabled])::before{content:"\2726  ";color:#ffe14a}
.btn.big{font-size:14px;padding:15px 20px;display:block;width:100%;max-width:440px;margin:9px auto}
.btn.sm{font-size:9px;padding:7px 9px;min-height:34px;margin:3px}
.btn.alt{color:#ccc;border-color:#777}
.btn.go{color:#ffe14a;border-color:#ffe14a}
.btn.danger{color:#ff5a6a;border-color:#ff5a6a}
.btn[disabled]{opacity:.35;cursor:not-allowed}
.card{border:3px solid #fff;padding:12px;margin:10px auto;text-align:left;background:#000;max-width:640px}
.card.sel{border-color:#ffe14a}
.card.locked{border-color:#444;color:#777}
.card h3{margin:0 0 8px}
.row{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:4px}
.between{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;text-align:left}
.grid .card{margin:0}
.tag{display:inline-block;font-size:9px;border:2px solid #555;padding:5px 7px;margin:3px;color:#ccc}
.tag.y{border-color:#ffe14a;color:#ffe14a}
.statbar{height:8px;background:#222;margin:3px 0 7px;position:relative}
.statbar i{display:block;height:100%}
table.stats{width:100%;border-collapse:collapse;font-size:10px;margin:8px 0}
table.stats td{padding:7px 4px;border-bottom:2px solid #1c1c1c;vertical-align:middle;text-align:left}
table.stats td.num{text-align:center;white-space:nowrap}
table.stats .desc{font-size:8px;color:#888;display:block;margin-top:4px;line-height:1.5}
.pend{color:#6aff8a}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:6px 0 12px}
.chip{font:inherit;font-size:9px;background:#000;color:#ddd;border:2px solid #555;padding:8px 9px;cursor:pointer;min-height:36px;touch-action:manipulation}
.chip.on{border-color:#ffe14a;color:#ffe14a}
.chip.lock{color:#777;border-style:dashed}
.chip .sw{display:inline-block;width:10px;height:10px;margin-right:6px;vertical-align:middle;border:1px solid #fff}
canvas.pv{image-rendering:pixelated;display:block;margin:8px auto;background:#000;border:3px solid #fff}
#modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;z-index:30;padding:16px}
#modal.show{display:flex}
#modal .box{background:#000;border:3px solid #fff;padding:20px;max-width:460px;width:100%;text-align:center}
#modal input{font:inherit;font-size:12px;width:100%;padding:10px;background:#000;color:#fff;border:2px solid #aaa;margin:10px 0;-webkit-user-select:text;user-select:text}
#toasts{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);z-index:40;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:92%;max-width:420px}
.toast{background:#000;border:3px solid #ffe14a;color:#fff;font-size:9px;line-height:1.7;padding:10px 12px;animation:tin .25s ease-out;text-align:center}
.toast b{color:#ffe14a}
@keyframes tin{from{transform:translateY(-20px);opacity:0}to{transform:none;opacity:1}}
.pop{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);z-index:45;font-size:22px;color:#ffe14a;text-shadow:3px 3px 0 #1a7cff;pointer-events:none;animation:popup 1.1s ease-out forwards;white-space:nowrap}
@keyframes popup{0%{transform:translate(-50%,-50%) scale(.4);opacity:0}20%{transform:translate(-50%,-50%) scale(1.15);opacity:1}100%{transform:translate(-50%,-120%) scale(1);opacity:0}}
.foot{margin-top:18px;font-size:8px;color:#666;line-height:2}
.relic{cursor:pointer}
.relic:hover{border-color:#ffe14a}
.ach{opacity:.45}.ach.got{opacity:1;border-color:#ffe14a}
.plat-phone h1.logo{font-size:28px}
.plat-phone .btn.big{font-size:13px}
@media (max-width:420px){h2{font-size:14px}.grid{grid-template-columns:1fr}}
@media (min-width:1700px){.panel{max-width:980px}p,li{font-size:12px}.btn{font-size:13px}.btn.big{font-size:16px;max-width:520px}}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="cv" width="640" height="480"></canvas>
    <div id="topbtns">
      <button class="tbtn" id="btnMute" title="Mute (M)">SND</button>
      <button class="tbtn" id="btnFull" title="Fullscreen (F)">FULL</button>
      <button class="tbtn" id="btnPause" title="Pause (Esc)" style="display:none">II</button>
    </div>
  </div>
  <div id="touch">
    <div class="tcol">
      <button class="tb small" id="tSpell">SPELL</button>
      <button class="tb small" id="tSpecial">SPECIAL</button>
    </div>
    <button class="tb" id="tFire">FIRE</button>
  </div>
</div>
<div id="ui"></div>
<div id="modal"><div class="box" id="modalBox"></div></div>
<div id="toasts"></div>
<script>
(function () {
  'use strict';
  /* ======================= ARCHITECTURE MAP =======================
   *  1. CONFIG & UTIL   – platform flag, helpers, number formatting
   *  2. DATA TABLES     – STATS, GRADES, CLASSES, PERKS, RELICS, PATTERN_INFO,
   *                       BOSSES, SHAPES/HATS/SHOTS pixel maps, COSMETICS,
   *                       ACHIEVEMENTS, CHEATS
   *  3. SAVE SYSTEM     – defaultState / normalizeState, 3 slots + Sandbox
   *  4. SOUND           – Web Audio synth, per-sound rate limits, mute
   *  5. STAT MATH       – soft caps, scaling grades, derived stats, perks
   *  6. SPRITES         – pixel maps -> cached canvases, spark drawing
   *  7. INPUT           – keyboard, touch drag, on-screen buttons
   *  8. COMBAT          – fight state machine, attack patterns, collisions
   *  9. RENDER          – fight scene, HUD, menu background
   * 10. UI SCREENS      – DOM menus generated from the data tables
   * 11. ACHIEVEMENTS & CHEATS
   * 12. MAIN LOOP & BOOT
   * ================================================================ */

  /* ===================== 1. CONFIG & UTIL ===================== */
  var PLATFORM = 'phone'; // build script sets 'phone' / 'desktop'; anything else = auto-detect
  var IS_TOUCH = ('ontouchstart' in window) || (navigator.maxTouchPoints || 0) > 0;
  if (PLATFORM !== 'phone' && PLATFORM !== 'desktop') {
    PLATFORM = (IS_TOUCH && Math.min(window.screen.width, window.screen.height) < 820) ? 'phone' : 'desktop';
  }
  document.documentElement.className += ' plat-' + PLATFORM;

  // Phone uses a taller canvas so text stays readable in portrait.
  var W = PLATFORM === 'phone' ? 400 : 640, H = PLATFORM === 'phone' ? 560 : 480;
  var CX = W / 2, BOX_BOTTOM = PLATFORM === 'phone' ? 420 : 400;
  var FONT = '"Press Start 2P", "Courier New", monospace';
  var VERSION = '1.0';

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function rand(a, b) { return a + Math.random() * (b - a); }
  function randi(a, b) { return Math.floor(rand(a, b + 1)); }
  function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function byId(list) { var o = {}; for (var i = 0; i < list.length; i++) o[list[i].id] = list[i]; return o; }
  function copy(o) { return JSON.parse(JSON.stringify(o)); }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; });
  }
  // Commas under 1M, then 1.25M / 30B / 2.5T / 1Qa
  function fmt(n) {
    n = Math.floor(n);
    if (Math.abs(n) < 1e6) return n.toLocaleString('en-US');
    var units = [[1e15, 'Qa'], [1e12, 'T'], [1e9, 'B'], [1e6, 'M']];
    for (var i = 0; i < units.length; i++) if (Math.abs(n) >= units[i][0]) return (n / units[i][0]).toFixed(2).replace(/\.?0+$/, '') + units[i][1];
    return String(n);
  }
  function fmtTime(sec) { sec = Math.max(0, sec); var m = Math.floor(sec / 60), s = Math.floor(sec % 60); return m + ':' + (s < 10 ? '0' : '') + s; }
  var ECHO = '✦';   // ✦
  var SPARKC = '✦';
  var STAR = '★';   // ★

  /* ===================== 2. DATA TABLES ===================== */
  var STATS = [
    { id: 'vig', name: 'Vigor',   short: 'VIG', desc: 'Max HP',                        color: '#ff5a6a' },
    { id: 'grd', name: 'Guard',   short: 'GRD', desc: 'Take less damage, bigger shield', color: '#6ad8ff' },
    { id: 'mgt', name: 'Might',   short: 'MGT', desc: 'Shot damage',                   color: '#ff9a3a' },
    { id: 'agi', name: 'Agility', short: 'AGI', desc: 'Move speed, fire rate, stamina', color: '#6aff8a' },
    { id: 'arc', name: 'Arcane',  short: 'ARC', desc: 'Spell power and mana',          color: '#c07aff' },
    { id: 'lck', name: 'Luck',    short: 'LCK', desc: 'Crits and Shard drops',    color: '#ffe14a' }
  ];
  var STAT_BY_ID = byId(STATS);
  // Soft caps: points past 15 are worth half, past 25 a fifth, so spreading points wins.
  var SOFTCAP1 = 15, SOFTCAP2 = 25;
  var PERK_NEED = 10;
  var GRADES = { S: 1.0, A: 0.8, B: 0.6, C: 0.4, D: 0.25, E: 0.12 };

  var CLASSES = [
    { id: 'striker', name: 'Striker', role: 'Attack', unlock: 0, color: '#ff9a3a',
      stats: { vig: 8, grd: 4, mgt: 11, agi: 9, arc: 3, lck: 5 },
      weapon: { name: 'Twin Fang', scale: { mgt: 'B', agi: 'D' } },
      spell: { name: 'Flare Burst', scale: { mgt: 'C', arc: 'D' } },
      passive: 'Every 5th shot deals double damage.' },
    { id: 'warden', name: 'Warden', role: 'Defense', unlock: 0, color: '#6ad8ff',
      stats: { vig: 11, grd: 11, mgt: 6, agi: 5, arc: 4, lck: 3 },
      weapon: { name: 'Bulwark Cannon', scale: { mgt: 'B', grd: 'B' } },
      spell: { name: 'Stone Aegis', scale: { grd: 'C', arc: 'C' } },
      passive: 'Perfect blocks heal 1 HP. Shield drains 30% slower.' },
    { id: 'mystic', name: 'Mystic', role: 'Magic', unlock: 0, color: '#c07aff',
      stats: { vig: 7, grd: 4, mgt: 4, agi: 7, arc: 14, lck: 4 },
      weapon: { name: 'Star Wand', scale: { arc: 'A', mgt: 'E' } },
      spell: { name: 'Star Nova', scale: { arc: 'S' } },
      passive: 'Mana refills twice as fast while moving. Bigger spell blast.' },
    { id: 'spellblade', name: 'Spellblade', role: 'Attack + Magic', unlock: 40, color: '#ff7ad9',
      stats: { vig: 8, grd: 5, mgt: 9, agi: 5, arc: 9, lck: 4 },
      weapon: { name: 'Rune Edge', scale: { mgt: 'B', arc: 'B' } },
      spell: { name: 'Rune Slash', scale: { arc: 'B', mgt: 'D' } },
      passive: 'Every shot that hits restores a little mana.' },
    { id: 'paladin', name: 'Paladin', role: 'Defense + Magic', unlock: 60, color: '#ffe14a',
      stats: { vig: 10, grd: 9, mgt: 5, agi: 4, arc: 8, lck: 4 },
      weapon: { name: 'Dawn Hammer', scale: { mgt: 'C', arc: 'C', grd: 'D' } },
      spell: { name: 'Holy Light', scale: { arc: 'A' } },
      passive: 'Spells also heal 3 HP.' },
    { id: 'gambler', name: 'Gambler', role: 'Luck', unlock: 90, color: '#6aff8a',
      stats: { vig: 6, grd: 5, mgt: 6, agi: 6, arc: 5, lck: 12 },
      weapon: { name: 'Loaded Dice', scale: { lck: 'A', mgt: 'D' } },
      spell: { name: 'Jackpot', scale: { lck: 'B', arc: 'C' } },
      passive: 'Shot damage is random (0.3x-1.7x). +25% Shards.' }
  ];
  var CLASS_BY_ID = byId(CLASSES);

  // Combo perks: unlock automatically when BOTH stats reach PERK_NEED.
  var PERKS = [
    { id: 'enchant',    name: 'Enchanted Shots', need: ['mgt', 'arc'], desc: 'Shots set the boss on fire.' },
    { id: 'mirror',     name: 'Mirror Shield',   need: ['grd', 'arc'], desc: 'Blocked bullets fly back and hurt the boss.' },
    { id: 'grazecrit',  name: 'Graze Crits',     need: ['agi', 'lck'], desc: 'Each graze makes your next shot a crit.' },
    { id: 'secondwind', name: 'Second Wind',     need: ['vig', 'grd'], desc: 'Survive one deadly hit per boss at 1 HP.' },
    { id: 'swift',      name: 'Swift Strikes',   need: ['mgt', 'agi'], desc: '+15% fire rate; every 6th shot is a 3-way spread.' },
    { id: 'luckyspell', name: 'Lucky Spell',     need: ['arc', 'lck'], desc: 'Spells have a 30% chance to cost no mana.' }
  ];

  // Relics: pick 1 of 3 after each boss. apply() edits the modifier object.
  var RELICS = [
    { id: 'twin',      name: 'Twin Barrel',     desc: 'Fire 2 shots at once, each deals 65% damage.', apply: function (m) { m.twin = true; } },
    { id: 'glass',     name: 'Glass Heart',     desc: '+40% damage, but -25% max HP.',               apply: function (m) { m.dmgMult *= 1.4; m.hpMult *= 0.75; } },
    { id: 'spare',     name: 'Spare Spark',     desc: 'Revive once at half HP. -10% damage.',        apply: function (m) { m.lives += 1; m.dmgMult *= 0.9; } },
    { id: 'magnet',    name: 'Shard Magnet',    desc: '+35% Shards.',                           apply: function (m) { m.shardMult *= 1.35; } },
    { id: 'watch',     name: 'Pocket Watch',    desc: 'Your turn lasts 1.5s longer.',                apply: function (m) { m.turnBonus += 1.5; } },
    { id: 'tiny',      name: 'Tiny Spark',      desc: 'Your hitbox is 30% smaller.',                 apply: function (m) { m.hitboxMult *= 0.7; } },
    { id: 'thick',     name: 'Thick Skin',      desc: 'Take 12% less damage.',                       apply: function (m) { m.drFlat += 0.12; } },
    { id: 'spring',    name: 'Mana Spring',     desc: 'Mana refills 2x faster.',                     apply: function (m) { m.manaRegenMult *= 2; } },
    { id: 'engine',    name: 'Graze Engine',    desc: 'Special meter fills 50% faster.',             apply: function (m) { m.grazeMult *= 1.5; } },
    { id: 'charm',     name: 'Healing Charm',   desc: 'Heal 30% more HP after each boss.',           apply: function (m) { m.healAfter += 0.3; } },
    { id: 'lens',      name: 'Crit Lens',       desc: '+10% crit chance.',                           apply: function (m) { m.critAdd += 0.10; } },
    { id: 'band',      name: 'Stamina Band',    desc: 'Shield drains 40% slower.',                   apply: function (m) { m.drainMult *= 0.6; } },
    { id: 'fang',      name: 'Vampire Fang',    desc: 'Heal 1 HP for every 60 damage you deal.',     apply: function (m) { m.lifesteal += 1; } },
    { id: 'hourglass', name: 'Sand Hourglass',  desc: 'Enemy bullets move 12% slower.',              apply: function (m) { m.bulletSlow *= 0.88; } },
    { id: 'ember',     name: 'Ember Stone',     desc: 'Shots set the boss on fire.',                 apply: function (m) { m.burn = true; } },
    { id: 'coin',      name: 'Lucky Coin',      desc: '+6 Luck.',                                    apply: function (m) { m.luckAdd += 6; } },
    { id: 'boots',     name: 'Feather Boots',   desc: '+20% move speed.',                            apply: function (m) { m.speedMult *= 1.2; } },
    { id: 'cell',      name: 'Overcharge Cell', desc: 'Special deals 60% more damage.',              apply: function (m) { m.specialMult *= 1.6; } }
  ];
  var RELIC_BY_ID = byId(RELICS);

  var PATTERN_INFO = {
    rain:      { name: 'Drizzle',     desc: 'Drops fall from above.' },
    aimed:     { name: 'Aimed Shots', desc: 'Bursts fired right at you.' },
    ring:      { name: 'Rings',       desc: 'Bullets burst out in a circle.' },
    wave:      { name: 'Wiggle Rain', desc: 'Drops that sway side to side.' },
    homing:    { name: 'Seekers',     desc: 'Slow orbs that follow you, then fade.' },
    walls:     { name: 'Walls',       desc: 'Rows of bullets with one gap. Find it!' },
    bombs:     { name: 'Bombs',       desc: 'Falling bombs that pop into rings.' },
    sidesweep: { name: 'Side Sweep',  desc: 'Bullets rush in from the sides.' },
    bouncers:  { name: 'Bouncers',    desc: 'Balls that bounce around the box.' },
    spiral:    { name: 'Spiral',      desc: 'A spinning bullet spiral.' },
    lasers:    { name: 'Lasers',      desc: 'Warning line, then a beam. Guard cannot block these!' },
    cross:     { name: 'Crossfire',   desc: 'Bullets from every side, aimed at you.' }
  };

  // Boss sprites: 16 rows x 8 columns, mirrored to 16x16.
  var BOSSES = [
    { id: 'pip', name: 'Pip the Puddle', title: 'A suspiciously friendly slime', hp: 1100, dmg: 5, spd: 0.85, dens: 0.85, turn: 6, box: [260, 170], light: false, combo: false, sway: 0, par: 45,
      quip: 'blub! (It wobbles at you menacingly.)',
      pal: { a: '#5ad35a', b: '#2f8a3a', c: '#b6ffb0', e: '#ffffff', k: '#111111', r: '#ff6a8a' },
      phases: [{ at: 1, pats: ['rain', 'aimed'] }],
      sprite: ['........', '........', '........', '........', '.......c', '.....cca', '....caaa', '...caaaa', '..caeeka', '..caekka', '.caaaaaa', '.aaaaaar', 'aaaaaaaa', 'baaaaaaa', 'bbaaaaaa', '.bbbbbbb'] },
    { id: 'candle', name: 'Sir Candlewick', title: 'Knight of the Melting Order', hp: 1500, dmg: 6, spd: 0.95, dens: 0.95, turn: 6.5, box: [260, 170], light: true, combo: false, sway: 0, par: 50,
      quip: 'Mind the wax. I just mopped.',
      pal: { a: '#f3e7c9', b: '#b89e6a', c: '#fffbe8', d: '#d8c49a', k: '#222222', r: '#ff6a1a', y: '#ffe14a' },
      phases: [{ at: 1, pats: ['rain', 'ring', 'aimed'] }],
      sprite: ['.......r', '......ry', '......ry', '.....ryy', '......ry', '.......k', '....cccc', '....aaaa', '....akaa', '....akaa', '...daaaa', '....aakk', '....aaaa', '...baaaa', '..bbbbbb', '.bbbbbbb'] },
    { id: 'moth', name: 'Queen Lumina', title: 'Monarch of the Lamplight', hp: 2000, dmg: 7, spd: 1.0, dens: 1.05, turn: 7, box: [260, 170], light: true, combo: false, sway: 20, par: 60,
      quip: 'Every light belongs to ME. Including yours.',

        if (p.inv <= 0) { hurt(f.dmg); f.bullets.splice(i, 1); if (F !== f || f.state === 'dead') return; }
        continue;
      }
      var gr = hr + 14;
      if (!b.grazed && d2 < gr * gr && p.inv <= 0) {
        b.grazed = true;
        var wasFull = p.meter >= 100;
        p.meter = Math.min(100, p.meter + 3 * d.grazeMult);
        f.grazes++; S.stats.grazes++;
        if (d.perks.grazecrit) p.critCh = Math.min(8, p.critCh + 1);
        f.parts.push({ x: (b.x + p.x) / 2, y: (b.y + p.y) / 2, vx: 0, vy: -20, life: 0.25, t: 0, col: '#ffffff', size: 2 });
        sfx('graze');
        if (f.grazes >= 50) unlockAch('grazer');
        if (!wasFull && p.meter >= 100) {
          floatText(p.x, p.y - 22, 'SPECIAL READY', '#ffe14a'); sfx('ready');
          if (!f.specialHinted && (f.tips || S.stats.specials === 0)) { f.specialHinted = true; showHint('SPECIAL is full! Press ' + keyName('special') + ' for a huge beam that clears bullets.', 5); }
        }
      }
    }
  }
  function updateShots(dt) {
    var f = F;
    for (var i = f.shots.length - 1; i >= 0; i--) {
      var s = f.shots[i];
      s.x += s.vx * dt; s.y += s.vy * dt;
      var half = 46 * bossScale;
      if (Math.abs(s.x - f.bossX) < half && s.y < f.bossY + half && s.y > f.bossY - half - 4 && f.state !== 'dying' && f.state !== 'dead') {
        dealBoss(s.dmg, s.crit, s.x, s.y - 6);
        if (F !== f) return;
        if (f.cls === 'spellblade') f.p.mana = Math.min(f.d.manaMax, f.p.mana + 0.8);
        if (f.d.burn) { f.burnT = 2; f.burnDps = Math.max(f.burnDps * 0.97, s.dmg * 0.5); }
        f.parts.push({ x: s.x, y: s.y, vx: rand(-30, 30), vy: rand(-40, 0), life: 0.2, t: 0, col: '#ffffff', size: 2 });
        f.shots.splice(i, 1);
        continue;
      }
      if (s.y < -20 || s.x < -20 || s.x > W + 20) f.shots.splice(i, 1);
    }
  }
  function updateLasers(dt) {
    var f = F, p = f.p, live = f.state === 'player' || f.state === 'boss';
    for (var i = f.lasers.length - 1; i >= 0; i--) {
      var l = f.lasers[i];
      l.t += dt;
      if (l.t >= l.warn && !l.fired) { l.fired = true; sfx('laser'); }
      if (l.t >= l.warn + l.act) { f.lasers.splice(i, 1); continue; }
      if (live && l.t >= l.warn) {
        var dist = l.horiz ? Math.abs(p.y - l.pos) : Math.abs(p.x - l.pos);
        if (dist < l.w / 2 + f.d.hitR * 0.5) { hurt(f.dmg); if (F !== f || f.state === 'dead') return; }
      }
    }
  }
  function updateSpells(dt) {
    var f = F;
    for (var i = f.spells.length - 1; i >= 0; i--) {
      var s = f.spells[i];
      var dx = f.bossX - s.x, dy = (f.bossY + f.bob) - s.y, dist = Math.sqrt(dx * dx + dy * dy);
      s.spin += dt * 10;
      if (dist < 30 || f.state === 'dying' || f.state === 'dead') {
        if (f.state !== 'dying' && f.state !== 'dead') {
          dealBoss(s.dmg, s.crit, f.bossX, f.bossY - 30, !!s.quiet, s.quiet ? null : s.col);
          if (F !== f) return;
          burst(s.x, s.y, s.col, 6, 90);
        }
        f.spells.splice(i, 1); continue;
      }
      s.x += dx / dist * s.sp * dt; s.y += dy / dist * s.sp * dt;
      if (Math.random() < 0.5) f.parts.push({ x: s.x, y: s.y, vx: rand(-20, 20), vy: rand(-20, 20), life: 0.3, t: 0, col: s.col, size: 2 });
    }
  }
  function updateBeamBurn(dt) {
    var f = F;
    if (f.beam > 0) {
      f.beam -= dt;
      dealBoss(f.beamDmg / 1.4 * dt, false, f.bossX, f.bossY, true);
      if (F !== f) return;
      if (Math.random() < 0.7) f.parts.push({ x: f.bossX + rand(-30, 30), y: f.bossY + rand(-30, 30), vx: rand(-80, 80), vy: rand(-80, 80), life: 0.4, t: 0, col: colorOf(S.skin, f.t), size: 3 });
    }
    if (f.burnT > 0) {
      f.burnT -= dt;
      dealBoss(f.burnDps * dt, false, f.bossX, f.bossY, true);
      if (F !== f) return;
      if (Math.random() < dt * 12) f.parts.push({ x: f.bossX + rand(-36, 36), y: f.bossY + rand(-10, 40), vx: 0, vy: -50, life: 0.5, t: 0, col: Math.random() < 0.5 ? '#ff9a3a' : '#ffe14a', size: 3 });
      if (f.burnT <= 0) f.burnDps = 0;
    }
    f.quietT -= dt;
    if (f.quietT <= 0) { f.quietT = 0.4; if (f.quietAcc >= 1) { floatText(f.bossX + rand(-20, 20), f.bossY - 40, fmt(Math.round(f.quietAcc)), '#ffb45a'); f.flash = 0.05; } f.quietAcc = 0; }
  }
  function updateParts(dt) {
    var f = F;
    for (var i = f.parts.length - 1; i >= 0; i--) {
      var q = f.parts[i]; q.t += dt;
      if (q.t >= q.life) { f.parts.splice(i, 1); continue; }
      if (q.ring) { q.r = q.maxR * (q.t / q.life); continue; }
      q.x += q.vx * dt; q.y += q.vy * dt;
    }
    for (var j = f.floats.length - 1; j >= 0; j--) { var fl = f.floats[j]; fl.t += dt; fl.y -= 30 * dt; if (fl.t > 0.9) f.floats.splice(j, 1); }
  }
  function burst(x, y, col, n, spd) {
    if (!F) return;
    for (var i = 0; i < n; i++) { var a = Math.random() * 6.28, v = rand(0.3, 1) * (spd || 80); F.parts.push({ x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: rand(0.25, 0.6), t: 0, col: col, size: randi(2, 3) }); }
    if (F.parts.length > 400) F.parts.splice(0, F.parts.length - 400);
  }
  function popAllBullets() {
    var f = F;
    for (var i = 0; i < f.bullets.length; i += 2) f.parts.push({ x: f.bullets[i].x, y: f.bullets[i].y, vx: rand(-30, 30), vy: rand(-30, 30), life: 0.25, t: 0, col: '#ffffff', size: 2 });
    f.bullets = []; f.lasers = [];
  }
  function floatText(x, y, text, col, size) {
    var f = F; if (!f) return;
    f.floats.push({ x: x, y: y, text: text, col: col, size: size || 1, t: 0 });
    if (f.floats.length > 36) f.floats.shift();
  }
  function showHint(text, dur) { F.hint = text; F.hintT = dur; }
  function banner(text) { F.banner = text; F.bannerT = 1.4; }

  /* ===================== 9. RENDER ===================== */
  var cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  var STARS = [];
  for (var si = 0; si < 70; si++) STARS.push({ x: Math.random() * W, y: Math.random() * H, s: Math.random() < 0.15 ? 2 : 1, v: rand(6, 22) });

  function txt(s, x, y, size, col, align) {
    ctx.font = (size || 8) + 'px ' + FONT;
    ctx.textAlign = align || 'left'; ctx.textBaseline = 'top';
    ctx.fillStyle = '#000'; ctx.fillText(s, Math.round(x) + 1, Math.round(y) + 1);
    ctx.fillStyle = col || '#fff'; ctx.fillText(s, Math.round(x), Math.round(y));
  }
  function bar(x, y, w, h, frac, col, back) {
    ctx.fillStyle = back || '#300'; ctx.fillRect(x, y, w, h);
    ctx.fillStyle = col; ctx.fillRect(x, y, Math.round(w * clamp(frac, 0, 1)), h);
  }
  function drawStars(t, tint) {
    for (var i = 0; i < STARS.length; i++) {
      var s = STARS[i], y = (s.y + t * s.v) % H;
      ctx.fillStyle = i % 5 === 0 ? tint : '#555';
      ctx.globalAlpha = 0.6; ctx.fillRect(Math.round(s.x), Math.round(y), s.s, s.s);
    }
    ctx.globalAlpha = 1;
  }
  function wrapLines(s, max) {

    if (cur) lines.push(cur);
    return lines;
  }

  function drawFight() {
    var f = F, p = f.p, d = f.d;
    ctx.save();
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
    if (f.shake > 0) ctx.translate(Math.round(rand(-f.shake, f.shake)), Math.round(rand(-f.shake, f.shake)));
    drawStars(f.t, f.def.pal.a);

    // Boss
    if (!(f.state === 'dying' && Math.floor(f.st * 12) % 2 === 0)) {
      var spr = bossSprite(f.def, f.flash > 0);
      var bw = spr.width * bossScale, bh = spr.height * bossScale;
      var alpha = f.state === 'dying' ? Math.max(0, 1 - f.st / f.stDur) : 1;
      ctx.globalAlpha = alpha;
      ctx.drawImage(spr, Math.round(f.bossX - bw / 2), Math.round(f.bossY + f.bob - bh / 2), bw, bh);
      ctx.globalAlpha = 1;
    }
    // Boss HP bar
    txt(f.def.name.toUpperCase(), 16, 12, 8, '#fff');
    txt('BOSS ' + (f.idx + 1) + '/10 ' + f.df.name.toUpperCase(), W - 16, 12, 8, f.df.color, 'right');
    bar(16, 26, W - 32, 8, f.bossHp / f.bossMax, f.phase > 0 ? '#ff5a3a' : '#ffe14a', '#331');
    for (var ph = 1; ph < f.def.phases.length; ph++) { ctx.fillStyle = '#000'; ctx.fillRect(16 + Math.round((W - 32) * f.def.phases[ph].at) - 1, 26, 2, 8); }
    if (f.burnT > 0) txt('BURN', 16, 38, 8, '#ff9a3a');

    // Box
    var turnCol = (f.state === 'player' || f.state === 'toPlayer') ? '#ffe14a' : '#ffffff';
    var rbx = Math.round(f.bx), rby = Math.round(f.by), rbw = Math.round(f.bw), rbh = Math.round(f.bh);
    ctx.fillStyle = '#000'; ctx.fillRect(rbx, rby, rbw, rbh);
    ctx.strokeStyle = turnCol; ctx.lineWidth = 3; ctx.strokeRect(rbx - 1.5, rby - 1.5, rbw + 3, rbh + 3);

    ctx.save();
    ctx.beginPath(); ctx.rect(rbx, rby, rbw, rbh); ctx.clip();
    // Lasers
    for (var li = 0; li < f.lasers.length; li++) {
      var l = f.lasers[li], on = l.t >= l.warn;
      if (on) { ctx.fillStyle = '#ffffff'; ctx.globalAlpha = 0.95; }
      else { ctx.fillStyle = '#ff3a3a'; ctx.globalAlpha = 0.25 + 0.25 * Math.sin(l.t * 30); }
      var w = on ? l.w : 2;
      if (l.horiz) ctx.fillRect(f.bx, Math.round(l.pos - w / 2), f.bw, w); else ctx.fillRect(Math.round(l.pos - w / 2), f.by, w, f.bh);
      if (!on) { ctx.globalAlpha = 0.12; if (l.horiz) ctx.fillRect(f.bx, Math.round(l.pos - l.w / 2), f.bw, l.w); else ctx.fillRect(Math.round(l.pos - l.w / 2), f.by, l.w, f.bh); }
      ctx.globalAlpha = 1;
    }
    // Bullets
    for (var bi = 0; bi < f.bullets.length; bi++) {
      var b = f.bullets[bi];
      var c = b.col || '#ffffff';
      if (b.kind === 'bomb') c = (b.fuse < 0.45 && Math.floor(b.t * 20) % 2) ? '#ffffff' : '#ff4a4a';
      ctx.fillStyle = c;
      ctx.beginPath(); ctx.arc(Math.round(b.x), Math.round(b.y), b.r, 0, 6.2832); ctx.fill();
      if (b.kind === 'home' || b.kind === 'bounce') { ctx.fillStyle = '#000'; ctx.fillRect(Math.round(b.x) - 1, Math.round(b.y) - 1, 2, 2); }
    }
    // Player spark
    if (f.state !== 'dead') {
      drawTrail(ctx, p.trail, S.skin, f.t, 2);
      var blink = p.inv > 0 && Math.floor(f.t * 20) % 2 === 0;

      ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(f.bossX, f.bossY + f.bob); ctx.stroke();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = bwid * 0.35; ctx.globalAlpha = 1;
      ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(f.bossX, f.bossY + f.bob); ctx.stroke();
    }

      ctx.globalAlpha = k; txt(f.def.name.toUpperCase(), W / 2, 202, 16, '#ffe14a', 'center');
      txt(f.def.title, W / 2, 228, 8, '#ccc', 'center'); ctx.globalAlpha = 1;

    if (f.state === 'dead' && f.st > 0.6) txt('YOUR SPARK FADED', W / 2, 200, 16, '#ff4a5a', 'center');
    ctx.restore();
  }

  function drawHud() {

    bar(lx + 28, y0 + 16, 150, 9, p.hp / d.maxHp, p.hp / d.maxHp < 0.3 ? '#ff4a4a' : '#ffe14a', '#500');
    txt(Math.ceil(p.hp) + '/' + d.maxHp, lx + 184, y0 + 17, 8, '#fff');
    txt('MP', lx, y0 + 31, 8, '#c07aff');

    txt(Math.floor(p.mana) + '/' + d.manaMax, lx + 184, y0 + 31, 8, '#c07aff');

    bar(rx, ry + 14, rw, 8, p.meter / 100, full ? '#ffe14a' : '#b36bff', '#212');

    else if (f.state === 'boss') { label = 'BOSS TURN - DODGE!'; col = '#fff'; frac = 1 - f.st / f.stDur; }
    else if (f.state === 'intro') { label = 'GET READY'; }
    txt(label, rx, ry + 30, 8, col);
    if (frac > 0) bar(rx, ry + 42, rw, 4, frac, col, '#222');
    if (p.critCh > 0) txt('CRIT x' + p.critCh, rx + rw, ry + 30, 8, '#ffe14a', 'right');

  }

  // Menu background: drifting stars and a few floating sparks.
  var menuT = 0, spinUntil = 0;
  function drawMenuBg(dt) {
    menuT += dt;
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
    drawStars(menuT, '#3ae0ff');
    var skin = S ? S.skin : { shape: 'spark', color: 'cyan', trail: 'none', hat: 'none', shot: 'dot' };
    for (var i = 0; i < 6; i++) {
      var x = (i * 117 + menuT * (10 + i * 3)) % (W + 40) - 20, y = 80 + ((i * 71) % (H - 160)) + Math.sin(menuT + i) * 12;
      ctx.globalAlpha = 0.18; drawSoul(ctx, x, y, skin, menuT, 0.18, 2);
    }
    ctx.globalAlpha = 1;
    if (menuT < spinUntil) {
      ctx.save(); ctx.translate(W / 2, H / 2); ctx.rotate(menuT * 8);
      drawSoul(ctx, 0, 0, skin, menuT, 1, 6); ctx.restore();
      txt('wheeee!', W / 2, H / 2 + 50, 16, '#ffe14a', 'center');
    }
  }

  /* ===================== 10. UI SCREENS ===================== */
  var uiEl = document.getElementById('ui');
  var modalEl = document.getElementById('modal'), modalBox = document.getElementById('modalBox');
  var pauseBtn = document.getElementById('btnPause');
  var rerender = null;
  var lastBuy = 0;
  var sbStart = 0;       // sandbox: starting boss
  var SHOP = { pend: {} };
  var modalBtns = [], modalEnter = null;

  function setScreen(name, html) {
    GAME.screen = name;
    if (name === 'fight') {
      uiEl.classList.remove('show'); uiEl.innerHTML = '';
      document.body.classList.add('fighting');
      pauseBtn.style.display = '';
    } else {
      document.body.classList.remove('fighting');
      uiEl.innerHTML = '<div class="panel">' + html + '</div>';
      uiEl.classList.add('show'); uiEl.scrollTop = 0;
      pauseBtn.style.display = 'none';
    }
    fit();
  }
  function debounced() { var now = Date.now(); if (now - lastBuy < 120) return true; lastBuy = now; return false; }
  function toast(html, ms) {
    var box = document.getElementById('toasts'), el = document.createElement('div');
    el.className = 'toast'; el.innerHTML = html; box.appendChild(el);
    setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, ms || 3200);
    while (box.children.length > 4) box.removeChild(box.firstChild);
  }
  function pop(text) {
    var el = document.createElement('div'); el.className = 'pop'; el.textContent = text; document.body.appendChild(el);
    setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 1200);
  }
  function openModal(html, btns, onEnter) {
    modalBtns = btns || []; modalEnter = onEnter || null;
    modalBox.innerHTML = html; modalEl.classList.add('show');

  function drawPreview(dt) {
    var c = document.getElementById('pvSpark'); if (!c) return;
    var x = c.getContext('2d'); x.imageSmoothingEnabled = false;
    pvT += dt;
    x.fillStyle = '#000'; x.fillRect(0, 0, c.width, c.height);
    var px = 100 + Math.cos(pvT * 1.6) * 50, py = 70 + Math.sin(pvT * 3.2) * 18;
    pvTrail.push({ x: px, y: py }); if (pvTrail.length > 10) pvTrail.shift();
    if (Math.random() < dt * 5) pvShots.push({ x: px, y: py - 10 });
    var col = colorOf(S.skin, pvT, 0);
    for (var i = pvShots.length - 1; i >= 0; i--) {
      var s = pvShots[i]; s.y -= 200 * dt;
      if (s.y < -10) { pvShots.splice(i, 1); continue; }
      var sp = shotSprite(S.skin.shot, col); x.drawImage(sp, Math.round(s.x - sp.width / 2), Math.round(s.y));
    }
    drawTrail(x, pvTrail, S.skin, pvT, 2);
    drawSoul(x, px, py, S.skin, pvT, 1, 3);
  }

  function showAchievements() {
    rerender = showAchievements;
    var got = 0; ACHIEVEMENTS.forEach(function (a) { if (S.ach[a.id]) got++; });
    var html = '<h2>ACHIEVEMENTS</h2><p class="y">' + got + ' / ' + ACHIEVEMENTS.length + '</p>' + (S.sandbox ? '<p class="muted">Achievements are off in Sandbox.</p>' : '') + '<div class="grid">';
    ACHIEVEMENTS.forEach(function (a) {
      var has = !!S.ach[a.id], hide = a.secret && !has;
      html += '<div class="card ach' + (has ? ' got' : '') + '"><h3 style="font-size:10px">' + (hide ? '???' : a.name) + '</h3><p style="font-size:8px">' + (hide ? 'Secret achievement' : a.desc) + '<br><span class="y">+' + a.reward + ' ' + ECHO + '</span>' + (a.unlock && !hide ? ' &middot; unlocks a cosmetic' : '') + '</p></div>';
    });
    html += '</div><button class="btn big alt" data-act="toMenu">BACK</button>';
    setScreen('ach', html);
  }

  function showSettings() {
    rerender = showSettings;
    var html = '<h2>SETTINGS</h2>';
    html += '<button class="btn big" data-act="mute">SOUND: ' + (muted ? 'OFF' : 'ON') + '</button>';
    html += '<button class="btn big" data-act="music">MUSIC: ' + (musicOn ? 'ON' : 'OFF') + '</button>';
    html += '<button class="btn big" data-act="toggleTips">FIRST-FIGHT TIPS: ' + (S.settings.tips ? 'ON' : 'OFF') + '</button>';
    if (PLATFORM === 'desktop') html += '<button class="btn big" data-act="fullscreen">FULLSCREEN (F)</button>';
    html += '<h3>CHEAT CODE</h3><div class="row"><input id="cheatIn" maxlength="14" style="font:inherit;font-size:11px;padding:10px;background:#000;color:#fff;border:2px solid #aaa;max-width:220px;-webkit-user-select:text;user-select:text" placeholder="TYPE CODE"><button class="btn" data-act="cheatEnter">ENTER</button></div><p class="muted" style="font-size:8px">Some codes mark your save with a ' + STAR + '. Looks-only codes do not.</p>';
    html += '<h3>SAVE</h3><div class="row"><button class="btn alt" data-act="renameCur">RENAME</button><button class="btn danger" data-act="resetCur">RESET PROGRESS</button><button class="btn danger" data-act="wipeCur">WIPE SLOT</button></div>';
    html += '<h3>CONTROLS</h3><p style="font-size:9px">' + (PLATFORM === 'phone' ? 'Drag anywhere on the game to move.<br>FIRE: shoot on your turn, GUARD on the boss turn.<br>SPELL: costs mana. SPECIAL: when the meter is full.' :
      'Arrows / WASD: move<br>Z / Space: shoot (your turn) or guard (boss turn)<br>X: spell &middot; C / Shift: special<br>Esc / P: pause &middot; M: mute &middot; F: fullscreen') + '</p>';
    html += '<button class="btn big alt" data-act="toMenu">BACK</button>';
    setScreen('settings', html);
    var inp = document.getElementById('cheatIn');
    if (inp) inp.addEventListener('keydown', function (e) { if (e.code === 'Enter') { e.preventDefault(); ACTIONS.cheatEnter(); } });
  }

  function continueRun() {
    var st = S.run.stage;
    if (st === 'rewards' && S.run.lastSummary) showRewards();
    else if (st === 'relic' || st === 'rewards') showRelicPick();
    else if (st === 'shop') showShop(true);
    else showPreview();
  }

  function togglePause(auto) {
    if (GAME.screen !== 'fight' || !F) return;
    if (GAME.paused) { GAME.paused = false; uiEl.classList.remove('show'); uiEl.innerHTML = ''; clearInput(); return; }
    GAME.paused = true; clearInput();
    if (!auto) { S.stats.pauses++; if (S.stats.pauses >= 20) unlockAch('snack'); }
    uiEl.innerHTML = '<div class="panel" style="margin-top:12vh"><h2>PAUSED</h2><p class="muted">' + F.def.name + ' &middot; ' + fmtTime(F.time) + '</p>' +
      '<button class="btn big go" data-act="resume">RESUME</button><button class="btn big" data-act="mute">SOUND: ' + (muted ? 'OFF' : 'ON') + '</button><button class="btn big" data-act="music">MUSIC: ' + (musicOn ? 'ON' : 'OFF') + '</button>' +
      (PLATFORM === 'desktop' ? '<button class="btn big" data-act="fullscreen">FULLSCREEN</button>' : '') +
      '<button class="btn big danger" data-act="quitFight">QUIT TO MENU</button><p class="muted" style="font-size:8px">Quitting restarts this boss next time.</p></div>';
    uiEl.classList.add('show');
  }

  function fightWon(f) {
    var run = S.run, d = f.d;
    var noHit = f.hits === 0, underPar = f.time <= f.def.par;
    var base = 40 + 15 * (f.idx + 1);
    var shards = Math.round(base * d.shardMult * (noHit ? 1.5 : 1) * (underPar ? 1.2 : 1));
    var interest = run.bank > 0 ? interestFor(run.bank, f.idx + 1) : 0;
    run.shards += shards + interest; run.bank = 0; run.spentThisShop = false;
    run.hp = Math.max(1, f.p.hp); run.time += f.time; run.cleared = f.idx + 1;
    if (noHit) run.noHits++;
    run.tipsDone = true;
    S.stats.best = Math.max(S.stats.best, f.idx + 1);
    unlockAch('first_blood');
    if (f.idx >= 4) unlockAch('halfway');
    if (noHit) unlockAch('untouchable');
    if (f.idx === 9 && noHit) unlockAch('flawless');
    if (f.time < 35) unlockAch('speedy');
    if (f.p.hp <= 3) unlockAch('clutch');
    if (run.shards >= 500) unlockAch('rich');
    var summary = { shards: shards, noHit: noHit, underPar: underPar, time: f.time, par: f.def.par, base: base, boss: f.def.name, healed: 0, interest: interest };
    F = null; musicStop();
    if (f.idx === 9) { endRun(true, summary); return; }
    var mh = derive(run).maxHp;
    var healed = Math.round(Math.min(mh, run.hp + mh * d.healAfter * f.df.heal) - run.hp);
    run.hp += healed; summary.healed = healed;
    run.level++; run.offer = makeOffer(run); run.stage = 'rewards'; run.lastSummary = summary;
    persist(); sfx('levelup');
    showRewards();
  }
  function fightLost() {
    var f = F; F = null; musicStop();
    S.run.time += f.time; S.stats.deaths++;
    if (f.idx === 0) unlockAch('skill_issue');
    endRun(false, { boss: f.def.name });
  }
  function endRun(won, summary) {
    var run = S.run;
    var df = DIFF_BY_ID[run.diff] || DIFF_BY_ID.normal;
    var echoes = S.sandbox ? 0 : Math.round((run.cleared * 6 + run.noHits * 3 + (won ? 60 : 0)) * df.echo);
    S.echoes += echoes;
    if (won) {
      S.stats.wins++; sfx('win');
      unlockAch('champion'); unlockAch('win_' + run.cls);
      if (run.stats.vig <= 8) unlockAch('glass');
      if (df.id === 'hard' || df.id === 'death') unlockAch('win_hard');
      if (df.id === 'death') unlockAch('win_death');
    }
    var info = { won: won, echoes: echoes, cls: run.cls, cleared: run.cleared, time: run.time, relics: run.relics.length, lv: soulLevel(run.stats), boss: summary.boss, diff: df };
    S.run = null; persist();
    showEnd(info);
  }

  /* ===================== 11. ACHIEVEMENTS & CHEATS ===================== */
  function cosName(cat, id) { var n = id; COSMETICS[cat].forEach(function (it) { if (it.id === id) n = it.name; }); return n; }
  function unlockAch(id) {
    if (!S || S.sandbox || S.ach[id]) return;
    var a = ACH_BY_ID[id]; if (!a) return;
    S.ach[id] = Date.now(); S.echoes += a.reward || 0;
    var extra = '';
    if (a.unlock) { S.unlocks[a.unlock[0]][a.unlock[1]] = 1; extra = '<br>Unlocked: ' + cosName(a.unlock[0], a.unlock[1]) + ' ' + a.unlock[0]; }
    toast('<b>ACHIEVEMENT!</b><br>' + esc(a.name) + '<br>+' + a.reward + ' ' + ECHO + ' Echoes' + extra);
    sfx('ach');
    persist();
  }
  function runCheat(code) {
    code = String(code || '').toUpperCase().replace(/[^A-Z]/g, '');
    for (var i = 0; i < CHEATS.length; i++) {
      var c = CHEATS[i];
      if (c.code === code) {
        var msg = c.run();
        if (c.flag && !S.sandbox) S.flags.cheated = true;
        persist(); sfx('buy');
        toast('<b>CODE ACCEPTED</b><br>' + esc(msg));
        if (rerender && GAME.screen !== 'fight') rerender();
        return true;
      }
    }
    return false;
  }
  function checkDrip() { var k = S.skin; if (k.shape !== COSMETICS.shape[0].id && k.color !== COSMETICS.color[0].id && k.trail !== 'none' && k.hat !== 'none') unlockAch('drip'); }

  var ACTIONS = {
    logo: function () { ACTIONS._logo = (ACTIONS._logo || 0) + 1; if (ACTIONS._logo % 7 === 0) { spinUntil = menuT + 3; sfx('honk'); } },
    slotPlay: function (a) {
      var key = parseKey(a);
      if (slotState(key)) { loadSlot(key); return; }
      if (key === 'sandbox') { setSlot(key, normalizeState(defaultState('Sandbox', true), true)); persist(); loadSlot(key); return; }
      promptBox('Name your spark:', 'Spark ' + (key + 1), function (name) { setSlot(key, normalizeState(defaultState(name, false), false)); curKey = key; S = slotState(key); persist(); showMenu(); });
    },
    slotRename: function (a) {
      var key = parseKey(a), st = slotState(key);
      promptBox('Rename ' + slotLabel(key) + ':', st.name, function (name) { st.name = name; lsSet(SAVE_KEY, JSON.stringify(store)); showSlots(); });
    },
    slotWipe: function (a) {
      var key = parseKey(a);
      confirmBox('Wipe ' + slotLabel(key) + '? This deletes everything in it and cannot be undone.', function () { setSlot(key, null); lsSet(SAVE_KEY, JSON.stringify(store)); showSlots(); }, 'WIPE');
    },
    toSlots: function () { persist(); S = null; curKey = null; showSlots(); },
    toMenu: function () { persist(); showMenu(); },
    continueRun: function () { continueRun(); },
    newRun: function () {
      if (S.run) confirmBox('Abandon your current run? You will not get Echoes for it.', function () { S.run = null; persist(); showClassSelect(); }, 'ABANDON');
      else showClassSelect();
    },
    playAgain: function (a) { showClassSelect(a); },
    sbLevel: function (a) { sbStart = clamp(sbStart + parseInt(a, 10), 0, 9); rerender(); },
    unlockClass: function (id) {
      var c = CLASS_BY_ID[id]; if (debounced()) return;
      if (S.echoes < c.unlock) { sfx('deny'); return; }
      S.echoes -= c.unlock; S.unlocks.cls[id] = 1; persist(); sfx('buy'); toast('<b>UNLOCKED</b><br>' + c.name); rerender();
    },
    pickClass: function (id) {
      if (S.settings.tips === null && !S.sandbox) {
        choice('Want quick tips during your first fight?', [
          { label: 'YES PLEASE', cls: 'go', fn: function () { S.settings.tips = true; newRun(id); } },
          { label: 'NO THANKS', cls: 'alt', fn: function () { S.settings.tips = false; newRun(id); } }]);
      } else newRun(id);
    },
    fight: function () { persist(); startFight(); },
    toShop: function () { showShop(true); },
    toRelic: function () { showRelicPick(); },
    relic: function (id) {
      var run = S.run; if (debounced() || !run.offer || run.offer.indexOf(id) < 0) return;
      run.relics.push(id); run.offer = null; run.stage = 'shop';
      var d = derive(run); run.hp = Math.min(run.hp, d.maxHp);
      if (run.relics.length >= 6) unlockAch('hoarder');
      persist(); sfx('buy'); showShop(true);
    },
    skipRelic: function () { var run = S.run; if (debounced()) return; run.shards += relicSkipBonus(run.level); run.offer = null; run.stage = 'shop'; persist(); showShop(true); },
    statPlus: function (id) {
      if (debounced()) return;
      var run = S.run, next = pointCost(run.bought + pendCount());
      if (run.shards - pendCost() < next) { sfx('deny'); return; }
      SHOP.pend[id] = (SHOP.pend[id] || 0) + 1; sfx('buy'); rerender();
    },
    statMinus: function (id) { if (debounced()) return; if (SHOP.pend[id]) { SHOP.pend[id]--; if (!SHOP.pend[id]) delete SHOP.pend[id]; } rerender(); },
    confirmStats: function () { if (debounced()) return; applyPending(); rerender(); },
    healBuy: function () {
      if (debounced()) return;
      var run = S.run, c = healCost(run.level), d = derive(run);
      if (run.shards - pendCost() < c || run.hp >= d.maxHp) { sfx('deny'); return; }
      run.shards -= c; run.hp = d.maxHp; run.spentThisShop = true; persist(); sfx('levelup'); rerender();
    },
    toPreview: function () { applyPending(); showPreview(); },
    customize: function () { if (!S) return; showCustomize(); },
    equip: function (a) { var p = a.split(':'); if (!S.unlocks[p[0]][p[1]]) return; S.skin[p[0]] = p[1]; checkDrip(); persist(); rerender(); },
    buyCos: function (a) {
      var p = a.split(':'), it = null; if (debounced()) return;
      COSMETICS[p[0]].forEach(function (x) { if (x.id === p[1]) it = x; });
      if (!it || it.cost <= 0) return;
      if (S.echoes < it.cost) { sfx('deny'); toast('Need ' + it.cost + ' ' + ECHO + ' Echoes. Beat bosses to earn more!'); return; }
      S.echoes -= it.cost; S.unlocks[p[0]][p[1]] = 1; S.skin[p[0]] = p[1]; checkDrip(); persist(); sfx('buy'); rerender();
    },
    howCos: function (a) { var p = a.split(':'); COSMETICS[p[0]].forEach(function (x) { if (x.id === p[1]) toast('<b>' + x.name + '</b><br>' + esc(x.how || 'Secret!')); }); },
    achievements: function () { showAchievements(); },
    settings: function () { showSettings(); },
    music: function () { setMusic(!musicOn); if (GAME.screen === 'fight') { togglePause(true); togglePause(true); } else if (rerender) rerender(); },
    setDiff: function (id) { if (!DIFF_BY_ID[id]) return; S.settings.diff = id; persist(); rerender(); },
    mute: function () { setMuted(!muted); if (GAME.screen === 'fight') { togglePause(true); togglePause(true); } else if (rerender) rerender(); },
    toggleTips: function () { S.settings.tips = !S.settings.tips; persist(); rerender(); },
    fullscreen: function () { toggleFullscreen(); },
    cheatEnter: function () {
      var inp = document.getElementById('cheatIn'); if (!inp) return;
      var ok = runCheat(inp.value); if (!ok) { sfx('deny'); toast('Nothing happened...'); }
      inp.value = '';
    },
    renameCur: function () { promptBox('Rename your spark:', S.name, function (n) { S.name = n; persist(); showSettings(); }); },
    resetCur: function () {
      confirmBox('Reset all progress in this slot? Your name stays, everything else goes.', function () {
        var n = S.name; S = normalizeState(defaultState(n, S.sandbox), S.sandbox); setSlot(curKey, S); persist(); showMenu();
      }, 'RESET');
    },
    wipeCur: function () { confirmBox('Wipe this whole slot? Cannot be undone.', function () { setSlot(curKey, null); S = null; lsSet(SAVE_KEY, JSON.stringify(store)); curKey = null; showSlots(); }, 'WIPE'); },
    resume: function () { togglePause(); },
    quitFight: function () {
      if (F) S.run.livesUsed = F.livesAtStart;
      F = null; GAME.paused = false; musicStop(); persist(); showMenu();
    }
  };
  function handleClick(e) {
    var el = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!el || el.disabled) return;
    initAudio();
    var act = el.getAttribute('data-act'), arg = el.getAttribute('data-arg');
    if (act === 'mBtn') {
      var fn = modalBtns[parseInt(arg, 10)];
      sfx('click');
      // Prompt OK reads the input first, then closes itself.
      if (fn && modalBox.querySelector('#mIn')) { fn(); return; }
      closeModal();
      if (fn) fn();
      return;
    }
    if (ACTIONS[act]) { sfx('click'); ACTIONS[act](arg, el); }
  }
  uiEl.addEventListener('click', handleClick);
  modalEl.addEventListener('click', function (e) { if (e.target === modalEl) { closeModal(); return; } handleClick(e); });

  /* ===================== 12. MAIN LOOP & BOOT ===================== */
  function toggleFullscreen() {
    var d = document, el = d.documentElement;
    try {
      if (!(d.fullscreenElement || d.webkitFullscreenElement)) {
        var r = (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
        if (r && r.catch) r.catch(function () {});
      } else (d.exitFullscreen || d.webkitExitFullscreen).call(d);
    } catch (e) {}
  }
  function fit() {
    var r = stageEl.getBoundingClientRect();
    var sc = Math.min(r.width / W, r.height / H);
    if (PLATFORM === 'desktop' && sc >= 2) sc = Math.floor(sc * 4) / 4;
    sc = Math.max(0.3, sc);
    cv.style.width = Math.floor(W * sc) + 'px'; cv.style.height = Math.floor(H * sc) + 'px';
  }
  function canvasScale() { return cv.getBoundingClientRect().width / W || 1; }
  var touchState = '';
  function syncTouch() {
    if (!F) return;
    var guard = F.state === 'boss', ready = F.p.meter >= 100, key = guard + '|' + ready;
    if (key === touchState) return;
    touchState = key;
    tFire.textContent = guard ? 'GUARD' : 'FIRE';
    tFire.classList.toggle('guard', guard);
    tSpecial.classList.toggle('ready', ready);
  }

  var lastTs = 0;
  function frame(ts) {
    var dt = lastTs ? Math.min(0.05, (ts - lastTs) / 1000) : 0.016;
    lastTs = ts;
    try {
      if (GAME.screen === 'fight' && F) {
        if (!GAME.paused) updateFight(dt);
        if (F) drawFight(); else drawMenuBg(dt);
        if (PLATFORM === 'phone') syncTouch();
      } else drawMenuBg(dt);
      if (GAME.screen === 'custom') drawPreview(dt);
      musicTick(GAME.paused || GAME.screen !== 'fight');
    } catch (err) { if (window.console) console.error(err); }
    requestAnimationFrame(frame);
  }

  document.getElementById('btnMute').addEventListener('click', function () { initAudio(); setMuted(!muted); if (rerender && (GAME.screen === 'settings')) rerender(); });
  document.getElementById('btnFull').addEventListener('click', function () { toggleFullscreen(); });
  pauseBtn.addEventListener('click', function () { togglePause(); });
  window.addEventListener('resize', fit);
  document.addEventListener('fullscreenchange', fit);
  document.addEventListener('visibilitychange', function () { if (document.hidden && GAME.screen === 'fight' && F && !GAME.paused) togglePause(true); });
  if (document.fonts && document.fonts.load) { try { document.fonts.load('8px "Press Start 2P"'); } catch (e) {} }

  // Remember lives at fight start so quitting mid-fight is a clean restart.
  var _startFight = startFight;
  startFight = function () { _startFight(); if (F) F.livesAtStart = S.run.livesUsed; };

  cv.width = W; cv.height = H; ctx.imageSmoothingEnabled = false;
  loadStore();
  setMuted(muted);
  showSlots();
  requestAnimationFrame(frame);

  // Small hook for automated testing only.
  window.__sparkGauntlet = {
    state: function () { return S; }, fight: function () { return F; }, screen: function () { return GAME.screen; },
    act: function (name, arg) { ACTIONS[name](arg); }, killBoss: function () { if (F) { F.bossHp = 1; dealBoss(5, false, CX, 100); } },
    derive: derive, bosses: BOSSES, classes: CLASSES
  };
})();
</script>
</body>
</html>
